# 能源管理平台 · 统一入口
#
# 一个 nginx 容器代理四样东西：
#
#   /             → guard-server (Java)：TB 前端 + REST API + WebSocket
#
# ★ Host 一律用 $http_host 而不是 $host
#   $host 是「不含端口的服务器名」，$http_host 是「客户端原始 Host 头」（含端口）。
#   激活链接、重置密码链接都由后端 MiscUtils.constructBaseUrl() 从
#   request.getServerPort() 推导 —— 传 $host 时端口被剥掉，Tomcat 按 http 默认
#   补成 80，客户拿到的链接就是 http://IP:80/...，打不开。
#   这个坑 2026-10-22 实测踩过（激活链接返回 127.0.0.1:80，服务实际在 8090）。
#   反向代理到域名 / https 时 $http_host 同样正确，它保留的就是用户看到的地址。
#   /spsspro/     → 数据分析前端（静态文件，由本容器直接发）
#   /spssproapi/  → 数据分析后端 (Python/FastAPI)
#   /api/...      → 同 /，仍走 guard-server
#
# 路径设计说明：
#   spsspro 前端的 Vite base 构建成 /spsspro/，API 客户端用绝对路径 /spssproapi。
#   两者靠尾斜杠区分，不会互相吃掉前缀。

upstream energy_backend {
    server energy-server:8090;
    keepalive 32;
}

upstream spsspro_backend {
    server spsspro-backend:9000;
    keepalive 16;
}

# WebSocket 升级：有 Upgrade 头就转发，没有就清空 Connection
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 从客户端原始 Host 头里取端口，没有端口就退回本机监听端口。
#
# ★ 这个 map 不能删 —— 激活链接 / 重置密码链接的端口全靠它。
#   后端 MiscUtils.getPort() 的判断顺序是：
#     ① 有 x-forwarded-port → 用它
#     ② 否则只要有 x-forwarded-proto → http 硬编码 80、https 硬编码 443
#     ③ 都没有 → request.getServerPort()
#   我们必然要传 X-Forwarded-Proto（https 下取真实协议），于是掉进 ②，
#   端口被强制写成 80，客户拿到的激活链接是 http://IP:80/...，打不开。
#   实测症状：服务在 8090，激活链接返回 127.0.0.1:80（2026-10-22）。
map $http_host $forwarded_port {
    "~:(?<client_port>\d+)$"  $client_port;
    default                    $server_port;
}

server {
    listen 80;
    server_name _;

    # TB 的资源/图片上传默认上限 50MB，这里与它对齐
    client_max_body_size 50m;
    client_body_timeout 120s;

    # 压缩：JS/CSS/JSON 体积能降 70% 以上
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/xml+rss image/svg+xml;

    # ---------------------------------------------------------------- 健康检查
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ─────────────────────────────────────────── spsspro 前端（静态）
    #
    # 与 /spsspro/ 同样的两条前缀匹配思路：
    # 正则 location + alias + try_files 会把 $uri 再接一次，变成
    # /spsspro/spsspro/... 之类的错路径；前缀 location 与 alias 都带
    # 尾斜杠时映射是一对一的。
    #
    # 前缀不会和 /spssproapi/ 混淆：/spsspro/ 要求第 9 个字符是斜杠，
    # 而 /spssproapi/... 的第 9 个字符是 'a'。
    location ^~ /spsspro/assets/ {
        alias /usr/share/nginx/html/spsspro/assets/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ★ 精确匹配 index.html，必须在前缀 location 之前生效（nginx 精确匹配总是优先）。
    #
    # 为什么需要这一条：下面 /spsspro/ 的 try_files 回落目标是 /spsspro/index.html，
    # 它会重新匹配 /spsspro/ 这个 location，再次 try_files ——
    # 如果产物目录不存在（客户忘了构建 / 漏拷 spsspro-dist），
    # 就变成无限内部重定向，nginx 报 rewrite cycle 并返回 **500**。
    # 实测症状：/spsspro/ 500、日志写 "rewrite or internal redirection cycle"，
    # 看起来像服务崩了，实际只是静态文件没放上去。
    #
    # 加上这条后，文件在就发，不在就干净的 404。
    location = /spsspro/index.html {
        alias /usr/share/nginx/html/spsspro/index.html;
    }

    location ^~ /spsspro/ {
        alias /usr/share/nginx/html/spsspro/;
        index index.html;

        # history 路由：刷新 /spsspro/explore 要回落到 index.html，否则 404
        try_files $uri $uri/ /spsspro/index.html;

        # index.html 不缓存，否则发版后用户拿到旧壳子指向已删除的 chunk
        add_header Cache-Control "no-cache";
    }

    # ──────────────────────────── spsspro 后端 · WebSocket（必须单独一条）
    #
    # 训练进度推送走 /spssproapi/ws/training/{task_id}。
    # 不单写一条也能连上握手，但拿不到 Upgrade头 → nginx 按普通 HTTP 代理，
    # 连接建完立即断，前端会一直显示「等待中」而不报错。
    # 前缀比下面那条长，nginx 按最长匹配优先命中这里。
    location ^~ /spssproapi/ws/ {
        rewrite ^/spssproapi/(.*)$ /api/$1 break;
        proxy_pass http://spsspro_backend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 模型训练可能跑十几分钟，WebSocket 要一直活着
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ────────────────────────────────────────── spsspro 后端（Python）
    #
    # 前端配置的 API 基址是 /spssproapi（见 frontend/.env.production），
    # 这里 rewrite 成 /api 再转给后端 —— 后端路由前缀就是 /api，不用改代码。
    #
    # 为什么不用 proxy_pass http://spsspro_backend/api/ 这种带 URI 的写法：
    # 那样 nginx 会把 location 前缀替换成 /api/，行为等价但更容易和
    # 尾斜杠规则纠缠；显式 rewrite 看得更清楚。
    location ^~ /spssproapi/ {
        rewrite ^/spssproapi/(.*)$ /api/$1 break;
        proxy_pass http://spsspro_backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $forwarded_port;
        proxy_set_header Connection        "";

        # 大数据集上的统计/机器学习可能跑几分钟（shap 尤其慢），
        # 默认 60s 会直接 504，前端看到的是「服务器错误」而非「还在算」。
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # 结果集可能很大（时序点 × 多指标），关缓冲降首字节延迟
        proxy_buffering off;
    }

    # ------------------------------------------------- guard-server（Java 全量）
    location / {
        proxy_pass http://energy_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $forwarded_port;

        # TB 的实时推送（/api/ws）依赖 WebSocket 升级
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 长连接：设备在线状态、仪表板实时刷新都靠它
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_buffering off;
    }

    # 隐藏 nginx 版本号
    server_tokens off;
}
