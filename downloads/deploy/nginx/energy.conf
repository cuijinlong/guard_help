# 能源管理平台 · 统一入口
#
# 一个 nginx 容器代理四样东西：
#
#   /             → guard-server (Java)：TB 前端 + REST API + WebSocket
#   /ngxai/       → ngx-ai 前端（静态文件，由本容器直接发）
#   /ngxapi/      → ngx-ai 后端 (Python/FastAPI)
#   /api/...      → 同 /，仍走 guard-server
#
# 路径设计说明：
#   ngx-ai 前端的 Vite base 构建成 /ngxai/，它的 API 客户端用绝对路径 /ngxapi，
#   两者只差一个字母但不会冲突 —— nginx 的 ^~ 前缀匹配按最长匹配生效，
#   而 /ngxapi/ 的第 6 个字符是 p，不会被 /ngxai/ 这个带斜杠的前缀吃掉。

upstream energy_backend {
    server energy-server:8090;
    keepalive 32;
}

upstream ngxai_backend {
    server ngxai-backend:18801;
    keepalive 16;
}

# WebSocket 升级：有 Upgrade 头就转发，没有就清空 Connection
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # TB 的资源/图片上传默认上限 50MB，这里与它对齐
    client_max_body_size 50m;
    client_body_timeout 120s;

    # 压缩：JS/CSS/JSON 体积能降 70% 以上
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/xml+rss image/svg+xml;

    # ---------------------------------------------------------------- 健康检查
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ------------------------------------------------------- ngx-ai 前端（静态）
    #
    # 用两条前缀匹配而不是一条正则 + alias：
    # 正则 location 里 `alias .../ ; try_files $uri` 会把 $uri 整段再接一次，
    # 变成 .../ngxai/ngxai/assets/x.js，静态资源全 404。
    # 前缀 location 与 alias 都带尾斜杠时，映射是一对一的。
    location ^~ /ngxai/assets/ {
        alias /usr/share/nginx/html/ngxai/assets/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ^~ /ngxai/ {
        alias /usr/share/nginx/html/ngxai/;
        index index.html;

        # 前端是 history 路由：刷新 /ngxai/biz/predict 时要回落到 index.html，
        # 否则刷新深链接直接 404。
        try_files $uri $uri/ /ngxai/index.html;

        # index.html 必须每次校验，否则发版后用户拿到旧壳子
        add_header Cache-Control "no-cache";
    }

    # ------------------------------------------------------ ngx-ai 后端（Python）
    location ^~ /ngxapi/ {
        proxy_pass http://ngxai_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # AI 预测要跑 Prophet 训练，可能几十秒到几分钟
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 预测结果集可能较大（时序点），关掉缓冲减少首字节延迟
        proxy_buffering off;
    }

    # ------------------------------------------------- guard-server（Java 全量）
    location / {
        proxy_pass http://energy_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # TB 的实时推送（/api/ws）依赖 WebSocket 升级
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 长连接：设备在线状态、仪表板实时刷新都靠它
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_buffering off;
    }

    # 隐藏 nginx 版本号
    server_tokens off;
}
