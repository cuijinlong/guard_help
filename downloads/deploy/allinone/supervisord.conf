; 单容器内各进程的监管配置（替换 Debian 默认的 /etc/supervisor/supervisord.conf）
;
; 启动顺序由 entrypoint.sh 控制：它先初始化并启动 PostgreSQL，
; 等 pg_isready 通过、install 跑完后，才 exec supervisord。所以这里不用考虑 PG 依赖。
;
; 进程角色：
;   energy-server  Java 主服务（8090，仅本机）
;   ngxai-backend  Python FastAPI（18801，仅本机）
;   gateway        Nginx，唯一对外端口 80
;   postgres       由 entrypoint 以 pg_ctl 启动，这里不接管

[unix_http_server]
file=/var/lib/energy/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/var/lib/energy/logs/supervisord.log
logfile_maxbytes=20MB
logfile_backups=5
loglevel=info
pidfile=/var/lib/energy/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/lib/energy/run/supervisor.sock

; ---------------------------------------------------------------- Java 主服务
[program:energy-server]
command=/opt/java/openjdk/bin/java -Dinstall.data_dir=/opt/energy/data -Xms512m -Xmx%(ENV_SERVER_HEAP_MB)sm -jar /opt/energy/guard-server-4.4.0.jar --spring.config.name=thingsboard --spring.profiles.active=%(ENV_SPRING_PROFILE)s --server.port=8090
directory=/opt/energy
environment=SPRING_DATASOURCE_URL="jdbc:postgresql://127.0.0.1:5432/%(ENV_DB_NAME)s",SPRING_DATASOURCE_USERNAME="%(ENV_DB_USER)s",SPRING_DATASOURCE_PASSWORD="%(ENV_DB_PASSWORD)s",DATABASE_TS_TYPE="sql",DATABASE_ENTITIES_TYPE="sql",SERVICE_TYPE="monolith",HTTP_ENABLED="true",MQTT_ENABLED="true",MQTT_BIND_PORT="%(ENV_MQTT_PORT)s",COAP_ENABLED="false",LWM2M_ENABLED="false",COAP_SERVER_ENABLED="false",TB_QUEUE_TYPE="in-memory"
priority=20
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/var/lib/energy/logs/energy-server.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
redirect_stderr=true

; ------------------------------------------------------------- ngx-ai 后端
[program:ngxai-backend]
command=/opt/venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 18801 --workers 1 --timeout-keep-alive 300
directory=/app
environment=TB_BASE_URL="http://127.0.0.1:8090",TB_USERNAME="%(ENV_TB_API_USERNAME)s",TB_PASSWORD="%(ENV_TB_API_PASSWORD)s",TB_MAX_CONCURRENCY="16",PG_ENABLED="1",PG_DSN="postgresql://%(ENV_DB_USER)s:%(ENV_DB_PASSWORD)s@127.0.0.1:5432/%(ENV_DB_NAME)s",SQLITE_PATH="/app/data/ngxai.db",CORS_ORIGINS="http://127.0.0.1"
priority=30
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/var/lib/energy/logs/ngxai-backend.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
redirect_stderr=true

; ---------------------------------------------------------------- Nginx 网关
[program:gateway]
command=/usr/sbin/nginx -g "daemon off;"
priority=40
autostart=true
autorestart=true
startsecs=3
stopsignal=QUIT
stdout_logfile=/var/lib/energy/logs/nginx.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
redirect_stderr=true
