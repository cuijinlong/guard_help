# 能源管理平台 · 单机 Docker 部署
#
# 架构（全部在同一个 compose 网络里）：
#
#   浏览器 ──▶ gateway (nginx :80) ──┬──▶ energy-server (Java, 8090)
#                                    ├──▶ ngxai-backend (Python, 18801)
#                                    └──▶ /ngxai/ 静态文件（前端构建产物）
#
# 对外只暴露 gateway 一个端口。数据库与应用服务都不直接对外。
#
# 两种部署模式，由 .env 的 DEPLOY_MODE 选择：
#
#   DEPLOY_MODE=split     （默认）分容器：每个组件独立容器，可单独重启/升级
#   DEPLOY_MODE=allinone  单容器：全部进程跑在一个容器里，只暴露一个端口
#
# 两种模式用 compose profile 隔离，不会互相启动对方的服务。
# 单容器模式的 install 由容器 entrypoint 自动完成，不需要 install 服务。
#
# 设计取舍：
#   · 不构建自定义 Java/nginx 镜像 —— 官方镜像 + 挂载 jar / 配置 / 静态文件。
#     镜像层里不落业务文件，卸载时删目录就干净了。
#   · ngxai-backend 必须构建镜像：pip 依赖（含 Prophet 编译 Stan）无法挂载复用。
#   · install 放在独立 profile，正常 up 不会误跑。

name: energy

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-db-env: &db-env
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-thingsboard}
  SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
  DATABASE_TS_TYPE: sql
  DATABASE_ENTITIES_TYPE: sql

services:

  postgres:
    profiles: ["split"]
    image: postgres:16-alpine
    container_name: energy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-thingsboard}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      LANG: C.UTF-8
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-thingsboard}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    # 数据库不对外暴露：调试用 docker compose exec postgres psql
    logging: *default-logging

  # 一次性任务：建表 + 装载系统资源。跑完即退出，不常驻。
  install:
    image: eclipse-temurin:25-jre
    profiles: ["install"]
    environment:
      <<: *db-env
    volumes:
      - ${APP_HOME}/guard-server-4.4.0.jar:/opt/energy/app.jar:ro
      - ${APP_HOME}/data:/opt/energy/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["java"]
    command:
      - -Xms128m
      - -Xmx768m
      - -Dloader.main=com.guard.server.ThingsboardInstallApplication
      - -Dinstall.upgrade=false
      - -Dinstall.data_dir=/opt/energy/data
      - -cp
      - /opt/energy/app.jar
      - org.springframework.boot.loader.launch.PropertiesLauncher
      - --spring.config.name=thingsboard
      - --server.port=0
    logging: *default-logging

  energy-server:
    profiles: ["split"]
    image: eclipse-temurin:25-jre
    container_name: energy-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *db-env
      # RTU / 网关要能上报，就必须让本进程监听设备侧协议。
      # service.type 不设成 monolith，下面的 ENABLED 全部无效 —— 端点由
      # @ConditionalOnExpression("'${service.type}'=='monolith' && ...") 装配，
      # 缺了它 /api/v1/{token}/telemetry 直接 404（实测 2026-10-20）。
      SERVICE_TYPE: monolith
      HTTP_ENABLED: "true"
      MQTT_ENABLED: "true"
      MQTT_BIND_PORT: "${MQTT_PORT:-1883}"
      COAP_ENABLED: "false"
      LWM2M_ENABLED: "false"
      COAP_SERVER_ENABLED: "false"
      TB_QUEUE_TYPE: in-memory
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx${SERVER_HEAP:-2g}"
    volumes:
      - ${APP_HOME}/guard-server-4.4.0.jar:/opt/energy/app.jar:ro
      - ${APP_HOME}/data:/opt/energy/data:ro
      - ${APP_HOME}/logs:/opt/energy/logs
    # 8090 不映射到宿主：Web 访问一律经 gateway。
    # 1883 必须映射：RTU / 物联网网关需要直连 MQTT，走不了 nginx。
    expose:
      - "8090"
    ports:
      - "${MQTT_PORT:-1883}:${MQTT_PORT:-1883}"
    entrypoint: ["java", "-Dinstall.data_dir=/opt/energy/data", "-jar", "/opt/energy/app.jar"]
    command:
      - --spring.config.name=thingsboard
      - --spring.profiles.active=${SPRING_PROFILE:-dev}
      - --server.port=8090
    healthcheck:
      # temurin 镜像里没有 curl/wget，只能用 bash 的 /dev/tcp 探端口
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8090"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    logging: *default-logging

  ngxai-backend:
    profiles: ["split"]
    # 首次 up 会自动构建；镜像已存在且源码未变时秒过（有层缓存）
    build:
      context: ${APP_HOME}/ngxai-backend
      dockerfile: Dockerfile.prod
    image: ${AI_IMAGE:-energy/ngxai-backend:4.4.0}
    container_name: energy-ngxai-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      energy-server:
        condition: service_started
    environment:
      # 容器内互相访问用服务名；这里的 127.0.0.1 会是容器自己，必须是服务名
      TB_BASE_URL: http://energy-server:8090
      TB_USERNAME: ${TB_API_USERNAME:-tenant@thingsboard.org}
      TB_PASSWORD: ${TB_API_PASSWORD:-tenant}
      TB_MAX_CONCURRENCY: "16"
      PG_ENABLED: "1"
      PG_DSN: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-thingsboard}
      SQLITE_PATH: /app/data/ngxai.db
      # 同源访问（都经 gateway），CORS 实际不触发；保留内网地址便于直连调试
      CORS_ORIGINS: http://localhost:${HTTP_PORT:-8090},http://127.0.0.1:${HTTP_PORT:-8090}
    volumes:
      - ngxai-data:/app/data
    expose:
      - "18801"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18801/ngxapi/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    logging: *default-logging

  gateway:
    profiles: ["split"]
    image: nginx:1.27-alpine
    container_name: energy-gateway
    restart: unless-stopped
    depends_on:
      - energy-server
      - ngxai-backend
    ports:
      - "${HTTP_PORT:-8090}:80"
    volumes:
      - ${APP_HOME}/nginx/energy.conf:/etc/nginx/conf.d/default.conf:ro
      - ${APP_HOME}/ngxai-dist:/usr/share/nginx/html/ngxai:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  # ---------------------------------------------------------------- 单容器模式
  allinone:
    profiles: ["allinone"]
    build:
      context: ${APP_HOME}
      dockerfile: allinone/Dockerfile
    image: ${ALLINONE_IMAGE:-energy/allinone:4.4.0}
    container_name: energy-allinone
    restart: unless-stopped
    environment:
      DB_NAME: ${DB_NAME:-thingsboard}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      SERVER_HEAP_MB: ${SERVER_HEAP_MB:-2048}
      SPRING_PROFILE: ${SPRING_PROFILE:-dev}
      TB_API_USERNAME: ${TB_API_USERNAME:-tenant@thingsboard.org}
      TB_API_PASSWORD: ${TB_API_PASSWORD:-tenant}
      MQTT_PORT: ${MQTT_PORT:-1883}
    ports:
      - "${HTTP_PORT:-8090}:80"
      - "${MQTT_PORT:-1883}:${MQTT_PORT:-1883}"
    volumes:
      # PostgreSQL 数据、SQLite、日志都在这里；升级镜像不丢数据
      - allinone-data:/var/lib/energy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/api/noauth/setup/state | grep -q '\"status\"' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 240s
    logging: *default-logging

volumes:
  pgdata:
    name: energy-pgdata
  ngxai-data:
    name: energy-ngxai-data
  allinone-data:
    name: energy-allinone-data
